<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Outer double rings -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" stroke="#065f46" stroke-width="4"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#065f46" stroke-width="1.5"/>
  
  <!-- Typography -->
  <g fill="#065f46" font-family="Times New Roman, Georgia, serif">
    <!-- S & C intertwined look via tight letter spacing -->
    <text x="60" y="65" font-size="54" text-anchor="middle" letter-spacing="-3">SC</text>
    <text x="65" y="105" font-size="48" text-anchor="middle">H</text>
  </g>

  <!-- Cactus & Succulent Motif -->
  <g stroke="#065f46" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Cactus Trunk -->
    <rect x="20" y="50" width="8" height="40" rx="4" stroke-width="2.5"/>
    <line x1="24" y1="55" x2="24" y2="80" stroke-width="1.5"/>
    
    <!-- Left Arm -->
    <path d="M 20 75 Q 12 75 12 65 L 12 55" stroke-width="2.5"/>
    
    <!-- Succulent Base -->
    <path d="M 24 95 Q 14 85 24 75 Q 34 85 24 95" fill="#ffffff" stroke-width="2"/>
    <path d="M 24 95 Q 8 90 14 80 Q 24 85 24 95" fill="#ffffff" stroke-width="2"/>
    <path d="M 24 95 Q 40 90 34 80 Q 24 85 24 95" fill="#ffffff" stroke-width="2"/>
  </g>
</svg>
